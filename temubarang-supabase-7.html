const ph=(it,c='')=>`<div class="ph ${c}" style="background:${it.img?'#000':COL[it.cat]}">${it.img?`<img src="${it.img}" alt="Foto ${esc(it.name)}">`:`<span role="img" aria-label="Ilustrasi ${esc(it.name)}">${EM(it)}</span>`}<i class="tag ${it.type==='hilang'?'h':''}" style="font-style:normal">${it.type==='hilang'?'Hilang':'Ditemukan'}</i></div>`;
const meta=it=>`<div class="meta"><span>${I('pin',14)}${esc(it.loc)}</span><span>${I('cal',14)}${fd(it.date)}</span></div>`;
const card=(it,c='')=>`<a class="card ${c}" href="#barang-${it.id}">${ph(it)}<div class="bd"><span class="meta">${esc(it.cat)}</span><h3>${esc(it.name)}</h3>${meta(it)}<span class="pill ${stl(it)[1]}">${stl(it)[0]}</span></div></a>`;
const rowc=it=>`<a class="row" href="#barang-${it.id}">${ph(it)}<div style="display:grid;gap:4px"><h3 style="font-size:1rem">${esc(it.name)}</h3>${meta(it)}<span class="pill ${stl(it)[1]}">${stl(it)[0]}</span></div></a>`;
const opt=(a,v,all)=>`<option value="">${all}</option>`+a.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('');

function home(){
const a=S.items,k=a.filter(i=>i.st==='kembali').length+HID,l=sorted().filter(i=>i.st!=='kembali').slice(0,4);
return`<section class="hero w"><div><p class="eyebrow">Lost &amp; Found Sekolah</p><h1>Barang Hilang, Harapan Bertemu.</h1><p class="lead">Laporkan barang yang hilang atau yang kamu temukan. Cari berdasarkan kategori dan lokasi, lalu hubungi langsung lewat chat.</p>
<form class="sb" id="hs" role="search">${I('search')}<input id="hq" placeholder="Cari nama barang, mis. botol minum" aria-label="Cari nama barang"><button class="btn">Cari Barang</button></form>
<a class="btn2" href="#lapor">${I('plus')}Laporkan Barang</a></div>
<div class="stats"><div><b>${a.length+HID}</b><span class="mu">laporan masuk</span></div><div><b>${a.filter(i=>i.st!=='kembali').length}</b><span class="mu">masih dicari atau menunggu pemilik</span></div><div class="g"><b>${k}</b><span class="mu">barang berhasil dikembalikan</span></div></div></section>
<div class="w"><h2 style="margin-bottom:14px">Telusuri per kategori</h2><div class="cats">${CATS.map(c=>`<button class="chip" onclick="goCat('${c}')">${CE[c]} ${c} <small>${a.filter(i=>i.cat===c).length}</small></button>`).join('')}</div>
<div class="sec"><h2>Laporan terbaru</h2><a href="#cari" onclick="F.cat=F.q=F.type=F.loc=F.range=''">Lihat semua</a></div>
<div class="feat">${l[0]?card(l[0],'big'):''}<div class="stack">${l.slice(1).map(rowc).join('')}</div></div></div>`}
function goCat(c){F.cat=c;F.q=F.type=F.loc=F.range='';location.hash='cari'}
function filt(){const lim={7:7,30:30}[F.range];const min=lim?day(lim):'';return sorted().filter(i=>(!F.q||i.name.toLowerCase().includes(F.q.toLowerCase())||i.desc.toLowerCase().includes(F.q.toLowerCase()))&&(!F.type||i.type===F.type)&&(!F.cat||i.cat===F.cat)&&(!F.loc||i.loc===F.loc)&&(!min||i.date>=min))}
function list(){const r=filt();$('#cnt').textContent=r.length+' barang ditemukan';$('#list').innerHTML=r.length?`<div class="grid">${r.map(i=>card(i)).join('')}</div>`:`<div class="empty"><div class="big">🔍</div><h3>Belum ada barang yang cocok</h3><p class="mu" style="margin:8px 0 18px">Coba kata kunci lain atau hapus beberapa filter. Kalau barangmu belum dilaporkan, kamu bisa membuat laporan baru.</p><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn2" onclick="clr()">Hapus filter</button><a class="btn" href="#lapor">Laporkan Barang</a></div></div>`}
function clr(){Object.keys(F).forEach(k=>F[k]='');route()}
function cari(){return`<div class="w"><h1 style="font-size:2rem">Cari Barang</h1><p class="mu" style="margin-top:8px">Temukan barang yang hilang atau ditemukan di lingkungan sekolah.</p>
<div class="filters"><input id="fq" type="search" placeholder="Cari nama barang…" aria-label="Cari nama barang" value="${esc(F.q)}"><select id="fc" aria-label="Kategori">${opt(CATS,F.cat,'Semua kategori')}</select><select id="fl" aria-label="Lokasi">${opt(LOCS,F.loc,'Semua lokasi')}</select><select id="fr" aria-label="Tanggal"><option value="">Semua tanggal</option><option value="7" ${F.range==='7'?'selected':''}>7 hari terakhir</option><option value="30" ${F.range==='30'?'selected':''}>30 hari terakhir</option></select></div>
<div class="seg" role="group" aria-label="Jenis laporan">${[['','Semua'],['hilang','Hilang'],['ditemukan','Ditemukan']].map(([v,t])=>`<button data-t="${v}" class="${F.type===v?'on':''}">${t}</button>`).join('')}</div>
<p class="mu sm" id="cnt" role="status" style="margin-bottom:14px"></p><div id="list"></div></div>`}
function bindCari(){list();const u=()=>{F.q=$('#fq').value;F.cat=$('#fc').value;F.loc=$('#fl').value;F.range=$('#fr').value;list()};['#fq','#fc','#fl','#fr'].forEach(s=>$(s).addEventListener('input',u));document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{F.type=b.dataset.t;document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b));list()})}

let MSG=[],THR=null,THRID=0;
async function loadMsgs(id){const{data,error}=await sb.from('messages').select('*').eq('item_id',id).order('created_at',{ascending:true});if(error)return false;MSG=data;return true}
function renderChat(it){const box=$('#msgs');if(!box)return;let th=it.own?THR:USER.id;
if(it.own&&$('#thr')){const ids=[...new Set(MSG.map(m=>m.inquirer))];if(!th&&ids.length===1)th=THR=ids[0];
$('#thr').innerHTML=ids.length?ids.map(q=>{const n=(MSG.find(m=>m.sender===q&&m.sender_name)||{}).sender_name||'Warga';return`<button type="button" class="chip" style="${q===th?'border-color:var(--tx);background:var(--nvbg)':''}" data-q="${q}">${esc(n)}</button>`}).join(''):'<span class="mu sm">Belum ada pesan masuk.</span>';
$('#thr').querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{THR=b.dataset.q;renderChat(it)})}
const l=MSG.filter(m=>m.inquirer===th);
box.innerHTML=l.length?l.map(m=>`<div class="m1 ${m.sender===USER.id?'me':''}">${esc(m.body)}</div>`).join(''):`<p class="mu sm">${it.own&&!th?'Pilih percakapan di atas.':'Belum ada pesan. Tulis pesan pertama.'}</p>`;
const ci=$('#ci');if(ci){ci.disabled=!th;ci.placeholder=th?'Tulis pesan…':'Belum ada percakapan'}box.scrollTop=1e5}
async function sendMsg(it,body){const th=it.own?THR:USER.id;if(!th){toast('Pilih percakapan dulu.',1);return false}
const{error}=await sb.from('messages').insert({item_id:it.id,inquirer:th,body:body.slice(0,500),sender_name:USER.nama});
if(error){toast('Pesan gagal dikirim: '+error.message,1);return false}
await loadMsgs(it.id);renderChat(it);return true}
let ADMIN=false,USER=null,LOADERR=false,HID=0;
const ST2={'Menunggu Pemilik':'aktif','Pemilik Ditemukan':'pemilik','Barang Sudah Dikembalikan':'kembali'},ST1={aktif:'Menunggu Pemilik',pemilik:'Pemilik Ditemukan',kembali:'Barang Sudah Dikembalikan'};
const fromRow=r=>({id:r.id,type:r.type,name:r.name,cat:r.cat,loc:r.loc,date:r.date,desc:r.descr,img:r.img||undefined,owner:r.owner,own:!!USER&&r.owner===USER.id,st:ST2[r.status]||'aktif',em:CE[r.cat]||'🎒',del:!!r.deleted_at});
async function loadItems(){const{data,error}=await sb.from('items').select('*').order('date',{ascending:false}).order('id',{ascending:false});if(error){if(!LOADERR)toast('Gagal memuat data: '+error.message,1);LOADERR=true;return false}LOADERR=false;const all=data.map(fromRow);HID=all.filter(i=>i.del).length;S.items=all.filter(i=>!i.del);return true}
async function setSt(id,st){if(!ADMIN){toast('Hanya admin atau petugas sekolah yang dapat mengubah status.',1);return}
const{data,error}=await sb.from('items').update({status:ST1[st]}).eq('id',id).select('id,status');
if(error||!data||!data.length){toast('Ditolak oleh database: hanya admin atau petugas yang boleh mengubah status.',1);route();return}
await loadItems();toast('Status disimpan: '+ST1[st]+'.');route()}
const stsel=it=>ADMIN?`<div class="note" style="display:grid;gap:10px"><b>Panel petugas</b><button class="btn2 sm2" id="ubs" style="justify-self:start">Ubah Status</button><div id="edt" style="display:none;gap:10px"><select id="stsel" aria-label="Status barang">${[['aktif','Menunggu Pemilik'],['pemilik','Pemilik Ditemukan'],['kembali','Barang Sudah Dikembalikan']].map(([v,t])=>`<option value="${v}" ${it.st===v?'selected':''}>${t}</option>`).join('')}</select><div class="act"><button class="btn sm2" id="sv">Simpan</button><button class="btn2 sm2" id="bt">Batal</button></div></div></div>`:'';
async function hapus(id){if(!confirm('Hapus laporan ini dari daftar? Foto barang akan dihapus permanen dan laporan disembunyikan dari daftar. Barang tetap dihitung sebagai berhasil dikembalikan.'))return;const{error}=await sb.rpc('hapus_laporan',{p_id:id});if(error){toast('Gagal menghapus: '+error.message,1);return}await loadItems();toast('Laporan dihapus dari daftar.');location.hash==='#profil'?route():location.hash='profil'}
function refresh(){const h=location.hash.slice(1),a=document.activeElement&&document.activeElement.tagName;if(!me()||h==='lapor')return;if(h==='cari'){list();return}if(a==='INPUT'||a==='TEXTAREA'||a==='SELECT')return;const y=scrollY;route();scrollTo(0,y)}
function startPoll(){setInterval(async()=>{const h=location.hash;if(!USER||document.hidden||!/^#barang-\d+$/.test(h))return;const it=S.items.find(i=>i.id===+h.slice(8));if(it&&await loadMsgs(it.id))renderChat(it)},4000);setInterval(async()=>{if(!USER||document.hidden)return;if(await loadItems())refresh()},10000);document.addEventListener('visibilitychange',async()=>{if(!document.hidden&&USER&&await loadItems())refresh()})}
function detail(id){const it=S.items.find(i=>i.id===id);if(!it)return`<div class="w"><div class="empty"><div class="big">🤷</div><h3>Laporan tidak ditemukan</h3><a class="btn" style="margin-top:16px" href="#cari">Kembali ke daftar</a></div></div>`;
const own=it.own,s=stl(it);
return`<div class="w"><a class="back" href="#cari">${I('back')}Kembali ke daftar</a><div class="det"><div>${ph(it)}<div class="chat"><h3>${it.own?'Pesan masuk dari warga sekolah':'Chat dengan '+(it.type==='hilang'?'pemilik':'penemu')}</h3>${it.own?'<div id="thr" class="act" style="padding:10px 16px 0"></div>':''}<div class="msgs" id="msgs" aria-live="polite"></div><form id="cf"><input id="ci" placeholder="Tulis pesan…" aria-label="Pesan" autocomplete="off" maxlength="500"><button class="btn" aria-label="Kirim pesan">${I('send')}</button></form></div></div>
<div><span class="pill ${s[1]}">${s[0]}</span><h1 style="font-size:2rem;margin:10px 0">${esc(it.name)}</h1><p class="mu">${esc(it.desc)}</p>
<div class="facts"><div>${I('pin')}<span><b>${esc(it.loc)}</b><br><span class="mu sm">${it.type==='hilang'?'Lokasi terakhir terlihat':'Lokasi barang ditemukan'}</span></span></div><div>${I('cal')}<span><b>${fd(it.date)}</b><br><span class="mu sm">Tanggal kejadian</span></span></div><div>${I('check')}<span><b>${esc(it.cat)}</b><br><span class="mu sm">Kategori · dilaporkan oleh ${own?'kamu':it.type==='hilang'?'pemilik':'penemu'}</span></span></div></div>
<p class="note">Demi keamanan, nomor kontak tidak ditampilkan. Gunakan chat dan verifikasi ciri khusus barang (isi, tanda, goresan) sebelum bertemu di area sekolah.</p>
${stsel(it)}${own?(it.st==='kembali'?`<button class="btn2" id="del">${I('x')}Hapus laporan dari daftar</button>`:''):it.st==='kembali'?'<p class="pill g">Barang ini sudah kembali ke pemiliknya</p>':`<button class="btn" id="cta">${it.type==='hilang'?'Saya Menemukan Barang Ini':'Hubungi Penemu / Ini Barang Saya'}</button>`}</div></div></div>`}
function bindDetail(id){const dl=$('#del');if(dl)dl.onclick=()=>hapus(id);const ub=$('#ubs');if(ub){ub.onclick=()=>{$('#edt').style.display='grid';ub.style.display='none'};$('#bt').onclick=()=>route();$('#sv').onclick=()=>setSt(id,$('#stsel').value)}
const it=S.items.find(i=>i.id===id);const f=$('#cf');if(!it||!f)return;if(THRID!==id){THR=null;THRID=id;MSG=[]}
f.onsubmit=async e=>{e.preventDefault();const v=$('#ci').value.trim();if(!v){toast('Pesan tidak boleh kosong.',1);return}if(await sendMsg(it,v))$('#ci').value=''};
const c=$('#cta');if(c)c.onclick=async()=>{await sendMsg(it,it.type==='hilang'?'Halo, sepertinya saya menemukan barang ini.':'Halo, ini sepertinya barang saya.');$('#ci').focus()};
renderChat(it);loadMsgs(id).then(ok=>{if(ok&&location.hash==='#barang-'+id)renderChat(it)})}

let ft='hilang',fimg='';
function lapor(){return`<div class="w"><h1 style="font-size:2rem">Laporkan Barang</h1><p class="mu" style="margin:8px 0 20px">Semakin jelas deskripsinya, semakin cepat barang kembali.</p>
<form class="form" id="lf" novalidate><div><div class="bar" role="progressbar" aria-label="Kelengkapan formulir" aria-valuemin="0" aria-valuemax="100" id="pb"><i id="pi"></i></div><p class="mu sm" id="pt" style="margin-top:6px"></p></div>
<div class="f"><label>Jenis laporan</label><div class="pick"><label><input type="radio" name="type" value="hilang" ${ft==='hilang'?'checked':''}>Barang Hilang</label><label><input type="radio" name="type" value="ditemukan" ${ft==='ditemukan'?'checked':''}>Barang Ditemukan</label></div></div>
<div class="f"><label for="n">Nama barang</label><input id="n" name="name" placeholder="mis. Botol minum tosca" maxlength="60"><div class="er" id="e-name"></div></div>
<div class="two"><div class="f"><label for="c">Kategori</label><select id="c" name="cat">${opt(CATS,'','Pilih kategori')}</select><div class="er" id="e-cat"></div></div>
<div class="f"><label for="l">Lokasi</label><select id="l" name="loc">${opt(LOCS,'','Pilih lokasi')}</select><div class="er" id="e-loc"></div></div></div>
<div class="f"><label for="d">Deskripsi</label><textarea id="d" name="desc" placeholder="Warna, merek, ciri khusus, isi barang…" maxlength="300"></textarea><div class="er" id="e-desc"></div></div>
<div class="f"><label for="dt">Tanggal kejadian</label><input id="dt" name="date" type="date" max="${day(0)}"><div class="er" id="e-date"></div></div>
<div class="f"><label for="ph">Foto (opsional, maks. 150 KB)</label><input id="ph" type="file" accept="image/*"><div id="pv" class="mu sm" style="margin-top:6px"></div></div>
<button class="btn" style="justify-self:start">${I('send')}Kirim Laporan</button></form></div>`}
function bindLapor(){const f=$('#lf');const fields=['name','cat','loc','desc','date'];
const prog=()=>{const n=fields.filter(k=>f[k].value.trim()).length;$('#pi').style.width=n*20+'%';$('#pb').setAttribute('aria-valuenow',n*20);$('#pt').textContent=n+' dari 5 isian wajib terisi'};
f.addEventListener('input',prog);prog();fimg='';
f.querySelectorAll('[name=type]').forEach(r=>r.onchange=()=>ft=r.value);
$('#ph').onchange=e=>{const fl=e.target.files[0];if(!fl)return;if(fl.size>150000){toast('Ukuran foto terlalu besar (maks. 150 KB).',1);e.target.value='';return}const r=new FileReader();r.onload=()=>{fimg=r.result;$('#pv').innerHTML=`<img src="${fimg}" alt="Pratinjau foto" style="height:80px;border-radius:10px">`};r.readAsDataURL(fl)};
f.onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(fields.map(k=>[k,f[k].value.trim()]));const er={};
if(v.name.length<3)er.name='Nama barang minimal 3 karakter.';if(!v.cat)er.cat='Pilih kategori.';if(!v.loc)er.loc='Pilih lokasi.';if(v.desc.length<10)er.desc='Deskripsi minimal 10 karakter.';if(!v.date)er.date='Isi tanggal kejadian.';else if(v.date>day(0))er.date='Tanggal tidak boleh di masa depan.';
fields.forEach(k=>{$('#e-'+k).textContent=er[k]||'';f[k].setAttribute('aria-invalid',er[k]?'true':'false')});
if(Object.keys(er).length){toast('Periksa kembali isian formulir.',1);const k=fields.find(k=>er[k]);f[k].focus();return}
const row={type:ft,name:v.name,cat:v.cat,loc:v.loc,date:v.date,descr:v.desc,owner:USER.id};if(fimg)row.img=fimg;
const{data,error}=await sb.from('items').insert(row).select('id').single();
if(error){toast('Laporan gagal dikirim: '+error.message,1);return}
await loadItems();toast('Laporan berhasil dikirim dan sudah tampil di daftar.');location.hash='barang-'+data.id}}

function profil(){const m=S.items.filter(i=>i.own),act=m.filter(i=>i.st!=='kembali'),his=m.filter(i=>i.st==='kembali');const ini=S.user.name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
const mr=i=>`<div class="row" style="grid-template-columns:84px 1fr"><a href="#barang-${i.id}" aria-label="Buka ${esc(i.name)}">${ph(i)}</a><div style="display:grid;gap:6px"><a href="#barang-${i.id}"><b>${esc(i.name)}</b></a><span class="pill ${stl(i)[1]}">${stl(i)[0]}</span><div class="act">${i.st==='kembali'?`<button type="button" class="btn2 sm2" data-del="${i.id}">${I('x',14)}Hapus</button>`:''}</div></div></div>`;
return`<div class="w"><div class="prof"><div class="avw"><div class="av" aria-hidden="true">${AV()?`<img src="${AV()}" alt="">`:esc(ini)}</div><button type="button" class="avb" id="avb" aria-label="Ganti foto profil">${I('img',16)}</button><input type="file" id="avf" accept="image/*" hidden></div><div><h1 style="font-size:1.8rem">${esc(S.user.name)}</h1><p class="mu">@${esc(USER.username||'')} · ${esc((me()||{}).email||'')} · ${m.length} laporan</p>${AV()?'<button type="button" class="btn2 sm2" id="avd" style="margin-top:10px">Hapus foto</button>':''}</div></div>
<div class="cols"><div><h2 style="margin-bottom:14px">Laporan saya</h2><div class="stack">${act.map(mr).join('')||'<div class="empty"><p class="mu">Belum ada laporan aktif.</p><a class="btn" style="margin-top:12px" href="#lapor">Laporkan Barang</a></div>'}</div>
<h2 style="margin:32px 0 14px">Riwayat barang dikembalikan</h2><div class="stack">${his.map(mr).join('')||'<p class="mu">Belum ada riwayat.</p>'}</div></div>
<div><h2 style="margin-bottom:14px">Pengaturan akun</h2><form id="uf" class="form" style="gap:14px"><div class="f"><label for="un">Nama tampilan</label><input id="un" value="${esc(S.user.name)}" maxlength="40"></div><div class="f"><label for="uk">Kelas</label><input id="uk" value="${esc(S.user.kelas)}" maxlength="20"></div><label style="display:flex;gap:10px;align-items:center;font-weight:500"><input type="checkbox" id="un2" style="width:auto;min-height:0" ${S.user.notif?'checked':''}>Notifikasi saat ada pesan baru</label><button class="btn" style="justify-self:start">Simpan pengaturan</button></form>
<button class="btn2" style="margin-top:22px" id="lo">${I('out')}Keluar</button></div></div></div>`}
function bindProfil(){document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>hapus(+b.dataset.del));const ab=$('#avb'),af=$('#avf');ab.onclick=()=>af.click();af.onchange=e=>{const fl=e.target.files[0];e.target.value='';if(!fl)return;if(!/^image\//.test(fl.type)){toast('Pilih file gambar (JPG, PNG, atau WebP).',1);return}const im=new Image(),u=URL.createObjectURL(fl);im.onload=async()=>{const z=256,m=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=z;c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,z,z);URL.revokeObjectURL(u);const d=c.toDataURL('image/jpeg',.8),{error}=await sb.from('avatars').upsert({user_id:USER.id,img:d});try{localStorage.setItem('tb2av:'+USER.id,d)}catch(x){}toast(error?'Foto hanya tersimpan di perangkat ini: '+error.message:'Foto profil diperbarui.',!!error);route()};im.onerror=()=>{URL.revokeObjectURL(u);toast('Foto tidak bisa dibaca. Coba file lain.',1)};im.src=u};const ad=$('#avd');if(ad)ad.onclick=async()=>{try{await sb.from('avatars').delete().eq('user_id',USER.id)}catch(x){}try{localStorage.removeItem('tb2av:'+USER.id)}catch(x){}toast('Foto profil dihapus.');route()};$('#uf').onsubmit=async e=>{e.preventDefault();const n=$('#un').value.trim();if(n.length<2){toast('Nama minimal 2 karakter.',1);return}S.user={name:n,kelas:$('#uk').value.trim()||'-',notif:$('#un2').checked};save();USER.nama=n;try{await sb.auth.updateUser({data:{nama:n}})}catch(e){}toast('Pengaturan disimpan.');route()};$('#lo').onclick=async()=>{await sb.auth.signOut();toast('Kamu sudah keluar.')}}

const AV=()=>{try{return(USER&&localStorage.getItem('tb2av:'+USER.id))||''}catch(e){return''}};
let PRE='';
const me=()=>USER;
async function applySession(sess){const u=sess&&sess.user;if(!u){USER=null;ADMIN=false;S.items=S.items.map(i=>({...i,own:false}));return}
const md=u.user_metadata||{};USER={id:u.id,email:u.email,nama:md.nama||(u.email||'').split('@')[0],username:md.username||''};S.user.name=USER.nama;
try{const{data}=await sb.from('profiles').select('role').eq('id',u.id).maybeSingle();ADMIN=!!data&&data.role==='admin'}catch(e){ADMIN=false}
try{const{data,error}=await sb.from('avatars').select('img').eq('user_id',u.id).maybeSingle();if(!error){if(data&&data.img)localStorage.setItem('tb2av:'+u.id,data.img);else localStorage.removeItem('tb2av:'+u.id)}}catch(e){}
await loadItems()}
const AUH=['mulai','masuk','daftar'];
if(sb)sb.auth.onAuthStateChange((ev,sess)=>{if(ev==='TOKEN_REFRESHED'||ev==='USER_UPDATED')return;setTimeout(async()=>{await applySession(sess);const h=location.hash.slice(1);if(!USER&&!AUH.includes(h))location.hash='mulai';else if(USER&&AUH.includes(h))location.hash='beranda';route()},0)});
const BR=s=>`<div class="brand">${LOGO.replace('width="34" height="34"','width="'+s+'" height="'+s+'"')}<span>Temu<b>Barang</b></span></div>`;
const SIM='';
const fl=(n,l,t,x)=>`<div class="f"><label for="a-${n}">${l}</label><input id="a-${n}" name="${n}" type="${t||'text'}" ${x||''}${t==='password'?' data-pw':''}><div class="er" id="e-${n}" role="alert"></div></div>`;
const sp='<label class="chk"><input type="checkbox" id="sp">Tampilkan kata sandi</label>';
const mulai=()=>`<section class="w au"><div class="aucard c">${BR(60)}<h1>Barang Hilang, Harapan Bertemu.</h1><p class="mu">Laporkan dan temukan barang hilang di lingkungan sekolah, lalu hubungi langsung lewat chat.</p><div class="act"><a class="btn" href="#masuk">Masuk</a><a class="btn2" href="#daftar">Daftar</a></div>${SIM}</div></section>`;
const masuk=()=>{const v=PRE;PRE='';return`<section class="w au"><div class="aucard">${BR(44)}<h1 style="text-align:center">Masuk</h1><form id="af" novalidate style="display:grid;gap:14px">${fl('login','Email','email',`autocomplete="username" value="${esc(v)}"`)}${fl('sandi','Kata sandi','password','autocomplete="current-password"')}${sp}<div class="er" id="e-all" role="alert" style="color:#B3402A;font-size:.88rem"></div><button class="btn">Masuk</button></form><p class="aut">Belum punya akun? <a href="#daftar">Daftar</a></p>${SIM}</div></section>`};
const daftar=()=>`<section class="w au"><div class="aucard">${BR(44)}<h1 style="text-align:center">Buat akun</h1><form id="af" novalidate style="display:grid;gap:14px">${fl('nama','Nama lengkap','text','autocomplete="name" maxlength="50"')}${fl('username','Username','text','autocomplete="username" maxlength="20"')}${fl('email','Email','email','autocomplete="email"')}${fl('sandi','Kata sandi (min. 8 karakter)','password','autocomplete="new-password"')}${fl('ulang','Konfirmasi kata sandi','password','autocomplete="new-password"')}${sp}<button class="btn">Buat Akun</button></form><p class="aut">Sudah punya akun? <a href="#masuk">Masuk</a></p>${SIM}</div></section>`;
function bindAuth(p){const f=$('#af');if(!f)return;const c=$('#sp');c.onchange=()=>f.querySelectorAll('[data-pw]').forEach(i=>i.type=c.checked?'text':'password');
f.onsubmit=async e=>{e.preventDefault();const er={},g=k=>f[k].value.trim(),ks=p==='daftar'?['nama','username','email','sandi','ulang']:['login','sandi'],btn=f.querySelector('button.btn');
const show=()=>ks.forEach(k=>{$('#e-'+k).textContent=er[k]||'';f[k].setAttribute('aria-invalid',er[k]?'true':'false')});
if(p==='daftar'){const v={nama:g('nama'),username:g('username'),email:g('email').toLowerCase(),sandi:f.sandi.value,ulang:f.ulang.value};
if(!v.nama)er.nama='Nama lengkap wajib diisi.';else if(v.nama.length<3)er.nama='Nama minimal 3 karakter.';
if(!v.username)er.username='Username wajib diisi.';else if(!/^[a-z0-9_]{3,20}$/i.test(v.username))er.username='Gunakan 3–20 huruf, angka, atau garis bawah (_).';
if(!v.email)er.email='Email wajib diisi.';else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email))er.email='Format email belum benar, contoh: nama@sekolah.id.';
if(!v.sandi)er.sandi='Kata sandi wajib diisi.';else if(v.sandi.length<8)er.sandi='Kata sandi minimal 8 karakter.';
if(!v.ulang)er.ulang='Konfirmasi kata sandi wajib diisi.';else if(v.ulang!==v.sandi)er.ulang='Konfirmasi tidak cocok dengan kata sandi.';
show();if(Object.keys(er).length){toast('Periksa kembali isian formulir.',1);f[ks.find(k=>er[k])].focus();return}
btn.disabled=true;const{data,error}=await sb.auth.signUp({email:v.email,password:v.sandi,options:{data:{nama:v.nama,username:v.username}}});btn.disabled=false;
if(error){const dup=/registered|exists/i.test(error.message);if(dup){er.email='Email sudah terdaftar. Silakan masuk.';show()}toast(dup?'Email sudah terdaftar.':'Pendaftaran gagal: '+error.message,1);return}
if(data.session){toast('Akun berhasil dibuat. Selamat datang!');return}
PRE=v.email;toast('Akun dibuat. Cek email untuk konfirmasi, lalu masuk.');location.hash='masuk';return}
const email=g('login').toLowerCase(),pw=f.sandi.value;$('#e-all').textContent='';
if(!email)er.login='Isi email.';if(!pw)er.sandi='Kata sandi wajib diisi.';show();
if(Object.keys(er).length){f[ks.find(k=>er[k])].focus();return}
btn.disabled=true;const{error}=await sb.auth.signInWithPassword({email,password:pw});btn.disabled=false;
if(error){$('#e-all').textContent=/confirm/i.test(error.message)?'Email belum dikonfirmasi. Cek kotak masuk emailmu.':'Email atau kata sandi salah. Periksa lagi, atau daftar jika belum punya akun.';toast('Gagal masuk.',1);return}
toast('Selamat datang!')}}
const NAV=[['beranda','Beranda','home'],['cari','Cari Barang','search'],['lapor','Laporkan Barang','plus'],['profil','Profil','user']];
function route(){const h0=location.hash.slice(1),AU=['mulai','masuk','daftar'];
if(!me()){if(!AU.includes(h0)){location.hash='mulai';return}$('#nt').innerHTML='';$('#nb').innerHTML='';$('#nb').style.display='none';$('#app').innerHTML=({mulai,masuk,daftar})[h0]();bindAuth(h0);window.scrollTo(0,0);return}
if(AU.includes(h0)){location.hash='beranda';return}$('#nb').style.display='';
const h=h0||'beranda',m=h.match(/^barang-(\d+)$/),k=m?'cari':NAV.some(n=>n[0]===h)?h:'beranda';
const L=(c,cl)=>NAV.map(n=>`<a href="#${n[0]}" class="${n[0]===k?'on':''}" ${n[0]===k?'aria-current="page"':''}>${I(n[2],cl)}${c?n[1].replace('Laporkan Barang','Lapor'):n[1]}</a>`).join('');
$('#nt').innerHTML=L(0,16);$('#nb').innerHTML=L(1,20);
$('#app').innerHTML=m?detail(+m[1]):({beranda:home,cari,lapor,profil})[k]();
if(m)bindDetail(+m[1]);else if(k==='cari')bindCari();else if(k==='lapor')bindLapor();else if(k==='profil')bindProfil();else{$('#hs').onsubmit=e=>{e.preventDefault();F.q=$('#hq').value.trim();F.cat=F.type=F.loc=F.range='';location.hash='cari'}}
window.scrollTo(0,0)}
window.addEventListener('hashchange',route);if(sb){startPoll();setTimeout(()=>{if(!$('#app').innerHTML.trim())route()},2500)}else $('#app').innerHTML='<div class="w"><div class="empty"><div class="big">📡</div><h3>Tidak bisa terhubung ke Supabase</h3><p class="mu" style="margin-top:8px">Periksa koneksi internet lalu muat ulang halaman.</p></div></div>';(()=>{const s=$('#splash');if(!s)return;const end=()=>{if(document.visibilityState==='hidden'){document.addEventListener('visibilitychange',()=>setTimeout(end,800),{once:true});return}s.classList.add('out');setTimeout(()=>s.remove(),600)};s.addEventListener('click',end);s.addEventListener('touchstart',end,{passive:true});setTimeout(end,1700)})();
</script>
</body>
